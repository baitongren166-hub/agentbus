# 推送版本标签后，四个平台构建成功才会创建 GitHub Release 草稿。
# 也可以在 Actions 页手动 Run workflow，只出包不发版。
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: mac-apple-silicon }   # M 系列芯片
          - { os: macos-15-intel, name: mac-intel }
          - { os: windows-latest, name: windows }
          - { os: ubuntu-22.04, name: linux }               # .deb + .AppImage
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"   # Windows 上 Python 默认不是 UTF-8，脚本里的中文会出错
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux 依赖（WebKitGTK、托盘）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 打包服务（Python → 可执行文件，用户不用装 Python）
        run: |
          pip install pyinstaller Pillow
          python scripts/build-core.py
      - name: 打包应用
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: agentbus-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release-notes.py "$RELEASE_TAG" release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: agentbus-*
          path: installers
      - name: Create release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: agentbus ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            installers/**/*.exe
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
