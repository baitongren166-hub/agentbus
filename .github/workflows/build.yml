# 打 v* 标签（git tag v0.6.0 && git push --tags）：四个平台各出安装包，发到 GitHub Releases（草稿，确认后手动发布）。
# 也可以在 Actions 页手动 Run workflow，只出包不发版。
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: mac-apple-silicon }   # M 系列芯片
          - { os: macos-15-intel, name: mac-intel }
          - { os: windows-latest, name: windows }
          - { os: ubuntu-22.04, name: linux }               # .deb + .AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux 依赖（WebKitGTK、托盘）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 打包服务（Python → 可执行文件，用户不用装 Python）
        run: |
          pip install pyinstaller
          python scripts/build-core.py
      - name: 打包应用
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: agentbus-${{ matrix.name }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: 发到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
